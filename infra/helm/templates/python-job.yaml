{{- if .Values.pythonJob.enabled }}
{{- if .Values.pythonJob.scriptContent }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-source
  labels:
    {{- include "labels" . | nindent 4 }}
data:
  job.py: |
    {{ .Values.pythonJob.scriptContent | nindent 4 }}
  requirements.txt: |
    {{ .Values.pythonJob.requirementsContent | nindent 4 }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        {{- include "labels" . | nindent 8 }}
    spec:
      {{- if .Values.pythonJob.hostNetwork }}
      # Use the node's network so the job reaches the node role's credentials (instance
      # metadata with an IMDSv2 hop limit of 1); cluster DNS still resolves Services.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.sourceDb.enabled }}
      initContainers:
        - name: wait-for-source-db
          image: {{ .Values.sourceDb.image }}
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for the in-cluster source database..."
              for i in $(seq 1 90); do
                pg_isready -h {{ include "name" . }}-{{ .Values.pythonJob.name }}-db -p 5432 && exit 0
                sleep 5
              done
              echo "Source database not ready after 450 s" >&2
              exit 1
      {{- end }}
      containers:
        - name: {{ include "name" . }}-{{ .Values.pythonJob.name }}
          image: {{ .Values.pythonJob.image.repository }}:{{ .Values.pythonJob.image.tag }}
          imagePullPolicy: {{ .Values.pythonJob.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              if [ -f /app/requirements.txt ]; then
                echo "Installing pipeline dependencies from requirements.txt..."
                pip install --no-cache-dir -r /app/requirements.txt
              fi
              python /app/job.py
          {{- $dbKeys := list "POSTGRES_HOST" "POSTGRES_PORT" "POSTGRES_NAME" "POSTGRES_USER" "POSTGRES_PASS" "POSTGRES_SSLMODE" }}
          {{- if or .Values.pythonJob.env .Values.sourceDb.enabled }}
          env:
            {{- range $name, $value := .Values.pythonJob.env }}
            {{- if not (and $.Values.sourceDb.enabled (has $name $dbKeys)) }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.sourceDb.enabled }}
            - name: POSTGRES_HOST
              value: {{ include "name" . }}-{{ .Values.pythonJob.name }}-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_NAME
              value: {{ .Values.sourceDb.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.sourceDb.user | quote }}
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-db
                  key: password
            - name: POSTGRES_SSLMODE
              value: "disable" # traffic stays inside the cluster network
            {{- end }}
          {{- end }}
          {{- if .Values.pythonJob.scriptContent }}
          volumeMounts:
            - name: script
              mountPath: /app
          {{- end }}
          resources:
            limits:
              cpu: {{ .Values.pythonJob.resources.limits.cpu }}
              memory: {{ .Values.pythonJob.resources.limits.memory }}
            requests:
              cpu: {{ .Values.pythonJob.resources.requests.cpu }}
              memory: {{ .Values.pythonJob.resources.requests.memory }}
      {{- if .Values.pythonJob.scriptContent }}
      volumes:
        - name: script
          configMap:
            name: {{ include "name" . }}-{{ .Values.pythonJob.name }}-source
      {{- end }}
      restartPolicy: {{ .Values.pythonJob.restartPolicy }}
  backoffLimit: {{ .Values.pythonJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.pythonJob.ttlSecondsAfterFinished }}
{{- end }}
