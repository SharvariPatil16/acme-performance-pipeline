pythonJob:
  enabled: false
  name: "python-job"
  scriptContent: ""
  requirementsContent: ""
  env: {} # environment variables for the job container (set per job by Terraform)
  backoffLimit: 4
  ttlSecondsAfterFinished: 100
  restartPolicy: Never
  image:
    repository: jupyter/all-spark-notebook
    pullPolicy: IfNotPresent
    tag: "latest"
  resources:
    limits:
      cpu: 1.0
      memory: 2Gi
    requests:
      cpu: 0.5
      memory: 1Gi

# Optional in-cluster PostgreSQL source for a data job (see templates/source-db.yaml).
sourceDb:
  enabled: false
  image: postgres:16
  database: acme_performance
  user: acme
  password: "" # set by Terraform from random_password; never committed
